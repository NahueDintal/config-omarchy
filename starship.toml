# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Timeout for starship to scan files (in milliseconds)
scan_timeout = 30

# Configuración del formato del prompt
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$java\
$docker_context\
$kubernetes\
$aws\
$gcloud\
$azure\
$terraform\
$cmd_duration\
$battery\
$time\
$line_break\
$character"""

# Módulo del sistema operativo (para mostrar el icono de Arch)
[os]
disabled = false
style = "bold fg:#1793d1"
format = "[$symbol]($style) "

[os.symbols]
Arch = " "
Ubuntu = ""
Debian = ""
Fedora = ""
Windows = ""

# Carácter del prompt
[character]
success_symbol = '[➜](bold #5e8686)'
error_symbol = '[➜](bold #da9797)'
vicmd_symbol = '[V](bold #c0c0c0)'

[username]
style_user = "bold dimmed blue"
style_root = "bold red"
format = "[$user]($style) "
disabled = false
show_always = false

# Hostname (solo se muestra en SSH)
[hostname]
ssh_only = true
format = "on [$hostname](bold red) "
disabled = false

# Directorio actual
[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
read_only = "🔒"

# Git branch
[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

# Git status
[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "?"
#stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# Python
[python]
symbol = " "
style = "bold yellow"
format = 'via [$symbol($version)]($style) '
python_binary = ["python", "python3", "python2"]

# C
[c]
symbol = " "
style = "bold blue"
format = 'via [$symbol($version)]($style) '

# Node.js
[nodejs]
symbol = " "
style = "bold green"
format = 'via [$symbol($version)]($style) '

# Rust
[rust]
symbol = "󱘗 "
style = "bold red"
format = 'via [$symbol($version)]($style) '

# Go
[golang]
symbol = " "
style = "bold cyan"
format = 'via [$symbol($version)]($style) '

# Java
[java]
symbol = " "
style = "bold red"
format = 'via [$symbol($version)]($style) '

# Gradle
[gradle]
symbol = " "
style = "bold red"
format = 'via [$symbol($version)]($style) '

# Docker
[docker_context]
symbol = " "
style = "bold blue"
format = 'via [$symbol$context]($style) '

# Kubernetes
[kubernetes]
symbol = "☸ "
style = "bold blue"
format = 'on [$symbol$context( \($namespace\))]($style) '

# AWS
[aws]
symbol = " "
style = "bold orange"
format = 'on [$symbol($profile )(\($region\) )]($style)'

# Google Cloud
[gcloud]
symbol = " "
style = "bold blue"
format = 'on [$symbol$account(@$domain)(\($region\))]($style) '

# Kotlin
[kotlin]
symbol = " "
style = "bold purple"
format = 'on [$symbol$account(@$domain)(\($region\))]($style) '

# Lua
[lua]
symbol = " "
style = "bold blue"
format = 'on [$symbol$account(@$domain)(\($region\))]($style) '

# Azure
[azure]
symbol = "󰠅 "
style = "bold blue"
format = 'on [$symbol($subscription)]($style) '

# Terraform
[terraform]
symbol = "💠 "
style = "bold purple"
format = 'via [$symbol$workspace]($style) '

# Batería (solo se muestra cuando está baja)
[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "⚡"
unknown_symbol = "❓"
empty_symbol = "❗"

[[battery.display]]
threshold = 25
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

# Tiempo de ejecución del último comando
[cmd_duration]
min_time = 2000
style = "bold yellow"
format = 'took [$duration]($style) '

# Hora actual (opcional, descomenta si la quieres)
[time]
disabled = true
style = "bold white"
format = '🕐 [$time]($style) '
time_format = "%T"

# Memoria RAM en uso (opcional)
[memory_usage]
disabled = true
threshold = 70
style = "bold dimmed red"
format = 'via $symbol [${ram_pct}]($style) '

# Disable the package module (como ya lo tenías)
[package]
disabled = true

# Deshabilita módulos que no necesites
[helm]
disabled = true

[cmake]
disabled = true

[cobol]
disabled = true

[crystal]
disabled = true

[dart]
disabled = true

[deno]
disabled = true

[dotnet]
disabled = true

[elixir]
disabled = true

[elm]
disabled = true

[erlang]
disabled = true

[haskell]
disabled = true

[julia]
disabled = true

[nim]
disabled = true

[ocaml]
disabled = true

[perl]
disabled = true

[php]
disabled = true

[purescript]
disabled = true

[red]
disabled = true

[ruby]
disabled = true

[scala]
disabled = true

[swift]
disabled = true

[vlang]
disabled = true

[zig]
disabled = true
